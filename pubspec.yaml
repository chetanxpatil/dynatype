name: dynatype
description: Simple, reusable JSON schemas for Dart and Flutter. Validate nested objects and lists with optional fields, nullable values, and precise errors.
version: 2.1.0
repository: https://github.com/chetanxpatil/dynatype
issue_tracker: https://github.com/chetanxpatil/dynatype/issues
documentation: https://pub.dev/documentation/dynatype/latest/
topics:
  - json
  - validation
  - schema

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  equatable: ^2.0.5
dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.3
