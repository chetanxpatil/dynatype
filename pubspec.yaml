name: dynatype
description: Validate JSON objects, required fields, nested objects, and typed lists in Dart and Flutter with clear, path-based validation errors.
version: 2.0.1
homepage: https://pub.dev/packages/dynatype
documentation: https://pub.dev/documentation/dynatype/latest/
topics:
  - json
  - validation
  - schema

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  equatable: ^2.0.5
dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.3
